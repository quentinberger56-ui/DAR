<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Fleury 91 - EVA Joueuses</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --fcf-red: #E30613;
  --fcf-red-dark: #b8030e;
  --fcf-black: #111111;
  --fcf-dark-gray: #1a1a1a;
  --fcf-light-gray: #f4f5f7;
  --fcf-white: #ffffff;
  --fcf-accent: #FFD700;
}

* {
  box-sizing: border-box;
  font-family: 'Montserrat', sans-serif;
}

body {
  background: #0f0f10;
  background-image: radial-gradient(circle at 50% 0%, #2a080a 0%, #0f0f10 75%);
  padding: 20px 15px;
  margin: 0;
  min-height: 100vh;
  color: #333;
  transition: background 0.4s ease;
}

/* Changement léger d'ambiance pour l'avant-pratique */
body.mode-avant {
  background-image: radial-gradient(circle at 50% 0%, #1a1e29 0%, #0f0f10 75%);
}

.container {
  max-width: 550px;
  margin: auto;
  background: var(--fcf-white);
  padding: 30px 25px;
  border-radius: 24px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  position: relative;
  overflow: hidden;
}

/* Bandeau supérieur aux couleurs du club */
.container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--fcf-red) 0%, var(--fcf-black) 50%, var(--fcf-red) 100%);
}

.header-logo {
  text-align: center;
  margin-bottom: 10px;
}

/* Style de l'image du logo du club */
.logo-img {
  max-width: 100px;
  height: auto;
  display: block;
  margin: 0 auto 5px auto;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
}

h1 {
  text-align: center;
  margin: 10px 0 20px 0;
  color: var(--fcf-black);
  font-weight: 800;
  font-size: 26px;
  text-transform: uppercase;
  letter-spacing: -0.5px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
  font-size: 14px;
}

/* Inputs Texte */
.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input[type="text"] {
  width: 100%;
  padding: 14px 16px;
  font-size: 15px;
  font-weight: 600;
  border: 2px solid #e1e1e1;
  border-radius: 12px;
  outline: none;
  transition: all 0.2s ease;
  background: #f9f9f9;
}

input[type="text"]:focus {
  border-color: var(--fcf-red);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.1);
}

/* Questions Card */
.question {
  margin-top: 20px;
  padding: 20px;
  background: var(--fcf-light-gray);
  border-radius: 16px;
  border-left: 4px solid var(--fcf-red);
}

.header-question {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.titre {
  font-weight: 700;
  font-size: 15px;
  color: var(--fcf-black);
  line-height: 1.4;
}

/* Sliders */
input[type="range"] {
  width: 100%;
  height: 8px;
  appearance: none;
  background: #ddd;
  border-radius: 10px;
  outline: none;
  margin-top: 18px;
}

/* Curseur Chrome / Safari / Edge */
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 28px;
  height: 28px;
  background: var(--fcf-black);
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid var(--fcf-red);
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  transition: transform 0.1s ease, background 0.2s;
}

input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.15);
}

/* Curseur Firefox */
input[type="range"]::-moz-range-thumb {
  width: 28px;
  height: 28px;
  background: var(--fcf-black);
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid var(--fcf-red);
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  transition: transform 0.1s ease;
}

.labels {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #666;
  margin-top: 8px;
  font-weight: 600;
}

.labels strong {
  color: var(--fcf-black);
}

/* Style curseur non sélectionné */
.eva-slider.not-selected::-webkit-slider-thumb {
  opacity: 0;
}
.eva-slider.not-selected::-moz-range-thumb {
  opacity: 0;
}

/* Boutons */
button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  background: var(--fcf-red);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(227, 6, 19, 0.3);
  transition: all 0.2s ease;
}

button:hover {
  background: var(--fcf-red-dark);
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(227, 6, 19, 0.4);
}

button:active {
  transform: translateY(0);
}

button.btn-menu {
  padding: 20px;
  margin-top: 15px;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

button.secondaire {
  background: var(--fcf-black);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
}

button.secondaire:hover {
  background: var(--fcf-dark-gray);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
}

button.btn-retour {
  background: transparent;
  color: #777;
  box-shadow: none;
  margin-top: 5px;
  font-size: 14px;
}

button.btn-retour:hover {
  background: #f0f0f0;
  color: var(--fcf-black);
  box-shadow: none;
}

button:disabled {
  background: #ccc !important;
  box-shadow: none !important;
  cursor: not-allowed;
  transform: none !important;
}

.cacher {
  display: none !important;
}
</style>
</head>

<body>

<div class="container">

  <!-- Logo officiel FC Fleury 91 -->
  <div class="header-logo">
    <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/6/61/Logo_FC_Fleury_91_-_2023.svg/1280px-Logo_FC_Fleury_91_-_2023.svg.png" alt="Logo FC Fleury 91" class="logo-img">
  </div>

  <!-- PAGE D'ACCUEIL -->
  <div id="page-accueil">
    <h1>Espace Joueuses</h1>
    <p class="subtitle">Sélectionne ton questionnaire du jour :</p>
    
    <button class="btn-menu" onclick="choisirFormulaire('avant')">
      ⚡ Questionnaire AVANT Pratique
    </button>
    
    <button class="btn-menu secondaire" onclick="choisirFormulaire('apres')">
      📋 Questionnaire APRÈS Pratique
    </button>
  </div>

  <!-- ZONE DU FORMULAIRE -->
  <div id="page-formulaire" class="cacher">
    <h1 id="titre-formulaire">Ressenti</h1>

    <div class="input-group">
      <input type="text" id="prenom" placeholder="Prénom">
      <input type="text" id="nom" placeholder="Nom">
    </div>

    <div id="questions"></div>

    <button id="btn-envoyer" onclick="envoyer()" style="margin-top: 30px;">Envoyer mes réponses</button>
    <button type="button" class="btn-retour" onclick="retourAccueil()">← Retour au menu</button>
  </div>

</div>

<script>
const URL_GOOGLE_SHEET = "https://script.google.com/macros/s/AKfycbxsw4aTpYkyTGoIOL57jeyXQd670po1FVCqv3NSNXFXb1JxHiGWW06-FnNxrq7uINkjyg/exec";

// Questionnaire APRÈS pratique
const questionsApres = [
  ["A", "Comment as-tu perçu ta relation avec le ballon ?", "Excellente", "Extrêmement difficile"],
  ["B", "As-tu eu le sentiment de percevoir le jeu avec clarté, fluidité, précision et rapidité ?", "Tout à fait", "Pas du tout"],
  ["C", "As-tu réussi à résoudre les problèmes posés par le jeu ?", "Tout à fait", "Pas du tout"],
  ["D", "À quel point la séance/match t'a-t-elle semblé difficile sur le plan cardio-respiratoire ?", "Extrêmement facile", "Effort insoutenable"],
  ["E", "À quel point la séance/match t'a-t-elle semblé difficile sur le plan musculaire ?", "Extrêmement facile", "Effort insoutenable"],
  ["F", "Comment as-tu perçu ta capacité à enchaîner les efforts ?", "Excellente", "Extrêmement mauvaise"],
  ["G", "Comment as-tu perçu ta capacité à développer de l'explosivité, à agir et réagir vite ?", "Excellente", "Extrêmement mauvaise"],
  ["H", "As-tu ressenti du plaisir au cours de la séance/match ?", "Maximal", "Aucun"],
  ["I", "Comment as-tu perçu ton niveau de concentration ?", "Excellent", "Extrêmement mauvais"]
];

// Questionnaire AVANT pratique
const questionsAvant = [
  ["A", "À quel point tu as de l'énergie pour la séance/match d'aujourd'hui ?", "Maximal", "Aucun"],
  ["B", "Comment estimes-tu ta motivation aujourd'hui ?", "Maximale", "Aucune"]
];

let modeActuel = ""; // "avant" ou "apres"
let questionsActives = [];
let reponses = {};

function choisirFormulaire(type) {
  modeActuel = type;
  reponses = { typeFormulaire: type };

  document.getElementById("page-accueil").classList.add("cacher");
  document.getElementById("page-formulaire").classList.remove("cacher");

  if (type === "avant") {
    document.body.classList.add("mode-avant");
    document.getElementById("titre-formulaire").innerText = "Avant Pratique";
    questionsActives = questionsAvant;
  } else {
    document.body.classList.remove("mode-avant");
    document.getElementById("titre-formulaire").innerText = "Après Pratique";
    questionsActives = questionsApres;
  }

  genererQuestions();
}

function retourAccueil() {
  document.body.classList.remove("mode-avant");
  document.getElementById("page-formulaire").classList.add("cacher");
  document.getElementById("page-accueil").classList.remove("cacher");
  document.getElementById("nom").value = "";
  document.getElementById("prenom").value = "";
  reponses = {};
}

function genererQuestions() {
  const zone = document.getElementById("questions");
  zone.innerHTML = "";

  questionsActives.forEach(q => {
    const labelTitre = (modeActuel === "apres") ? `${q[0]} - ${q[1]}` : q[1];

    zone.innerHTML += `
      <div class="question">
        <div class="header-question">
          <div class="titre">${labelTitre}</div>
        </div>

        <input 
          type="range" 
          id="${q[0]}" 
          min="0" 
          max="100" 
          step="1" 
          value="50" 
          class="eva-slider not-selected"
        >

        <div class="labels">
          <div>${q[2]}</div>
          <div style="text-align:right">${q[3]}</div>
        </div>
      </div>
    `;
  });

  // Activation des événements
  questionsActives.forEach(q => {
    const slider = document.getElementById(q[0]);

    slider.oninput = function() {
      this.classList.remove("not-selected");
      reponses[q[0]] = this.value;
    };
  });
}

function envoyer() {
  const nom = document.getElementById("nom").value.trim();
  const prenom = document.getElementById("prenom").value.trim();

  if (!nom || !prenom) {
    alert("Merci de renseigner ton nom et ton prénom.");
    return;
  }

  // Vérification que toutes les questions ont été renseignées
  if (Object.keys(reponses).length - 1 < questionsActives.length) {
    alert("Merci de répondre à toutes les questions.");
    return;
  }

  reponses.nom = nom;
  reponses.prenom = prenom;

  const btn = document.getElementById("btn-envoyer");
  btn.innerText = "Envoi en cours...";
  btn.disabled = true;

  fetch(URL_GOOGLE_SHEET, {
    method: "POST",
    body: JSON.stringify(reponses)
  })
  .then(() => {
    alert("Merci pour ton retour !");
    location.reload();
  })
  .catch(err => {
    alert("Erreur lors de l'envoi.");
    btn.innerText = "Envoyer mes réponses";
    btn.disabled = false;
  });
}
</script>

</body>
</html>
